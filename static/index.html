<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作笔记</title>
<link rel="stylesheet" href="/static/speech-drafts.css">
<style>
  :root{
    --bg:#111112; --panel:#19191b; --panel2:#232325; --line:#36363a;
    --fg:#e8eaf0; --dim:#9aa3b5; --accent:#ffb02e; --green:#34d17b; --red:#ff5c5c;
    --blue:#6aa1ff;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font-family:"Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
  }
  header{
    display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;
    background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto;
  }
  header .title{font-weight:700;font-size:18px;white-space:nowrap;flex-shrink:0}
  header button,header select{flex-shrink:0;white-space:nowrap;max-width:100%}
  header select{max-width:240px}
  .pill{font-size:12px;color:var(--dim)}
  select,button{
    background:var(--panel2);color:var(--fg);border:1px solid var(--line);
    border-radius:8px;padding:7px 14px;font-size:14px;cursor:pointer;
  }
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:#3a6df0;border-color:#3a6df0;font-weight:700}
  button:disabled{opacity:.45;cursor:not-allowed}
  #levelWrap{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
  #levelBarOuter{width:110px;height:12px;background:#0a0c10;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  #levelBar{height:100%;width:0%;background:linear-gradient(90deg,#2ecc71,#f1c40f,#e74c3c);transition:width .08s}
  /* 麦克风电平条 */
  .lvlsep{opacity:.3;margin:0 2px}
  #micBarOuter{width:90px;height:10px;background:#0a0c10;border:1px solid #2a5a3a;border-radius:6px;overflow:hidden}
  #micBar{height:100%;width:0%;background:linear-gradient(90deg,#3498db,#2ecc71);transition:width .08s}
  #micDot{color:var(--dim);transition:.15s}
  #micDot.on{color:#3498db}
  #micDot.spk{color:var(--green);animation:pulse .5s infinite alternate}
  #stateDot{width:10px;height:10px;flex-shrink:0;border-radius:50%;background:#555;display:inline-block}
  #stateDot.on{background:var(--green);box-shadow:0 0 8px var(--green)}
  #stateDot.speaking{animation:pulse .6s infinite alternate}
  @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.5)}}

  #feed{flex:1 1 auto;overflow-y:auto;padding:16px 22px;scroll-behavior:smooth}
  .qa{margin-bottom:18px;max-width:1100px}
  .qbox{
    background:#22201b;
    border-left:3px solid var(--accent);padding:10px 14px;border-radius:0;
    font-size:20px;line-height:1.5;font-weight:600;color:#ffe1a8;
  }
  .qbox .t{font-size:12px;color:var(--dim);font-weight:400;margin-right:8px}

  /* 快速卡 */
  .quickcard{
    margin-top:8px;background:transparent;border:0;
    border-radius:0;padding:10px 14px;font-size:18px;line-height:1.7;
  }
  .quickcard .opener{font-size:21px;color:#fff;font-weight:600;line-height:1.55}
  .quickcard .opener .tag,
  .quickcard .pt .tag{
    display:inline-block;font-size:11px;font-weight:700;color:#0f1115;background:var(--green);
    border-radius:4px;padding:1px 6px;margin-right:8px;vertical-align:2px;
  }
  .quickcard .pt .tag{background:var(--blue)}
  .quickcard .pt{margin-top:6px;color:#dbe2f0}
  .quickcard.pending{color:var(--dim);font-style:italic}
  .qbox,.quickcard,.subcard{overflow-wrap:anywhere}
  .answer-actions{display:flex;align-items:center;gap:8px;min-height:28px;margin-top:8px;white-space:normal}
  .answer-state{flex:1;min-width:0;color:var(--dim);font-size:12px;font-style:normal;line-height:1.4}
  .answer-state.error{color:var(--red)}
  .cancel-generation{width:28px;height:28px;padding:0;flex:0 0 28px;border-radius:4px;font-size:14px}
  .cancel-generation[hidden]{display:none}

  /* 展开方向 */
  .dirrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .dirrow .lbl{align-self:center;font-size:12px;color:var(--dim)}
  .chip{
    background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:6px 14px;font-size:14px;cursor:pointer;color:var(--fg);transition:.15s;
  }
  .chip:hover{border-color:var(--accent);background:#262d3b}
  .chip small{display:block;font-size:11px;color:var(--dim);max-width:230px;white-space:normal}
  .chip.full{border-color:#3a6df0;color:#9dbaff}

  /* 深挖子卡 */
  .subcard{
    margin-top:10px;background:#141a14;border:1px solid #274a2b;
    border-radius:10px;padding:12px 16px;font-size:17px;line-height:1.75;white-space:pre-wrap;
  }
  .subcard .hd{font-size:12px;color:var(--green);margin-bottom:4px}
  .subcard b{color:var(--accent)}
  .subcard.pending{color:var(--dim);font-style:italic}

  .answer-block{margin:0 0 14px;min-width:0}
  .answer-block:last-child{margin-bottom:0}
  .answer-block-label{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;font-size:13px;line-height:1.5;margin-bottom:4px}
  .answer-kind{color:var(--dim);font-size:12px;font-weight:600}
  .answer-block[data-kind="unknown"] .answer-kind,.answer-review{color:var(--accent)}
  .answer-block[data-kind="hypothesis"] .answer-kind{color:var(--blue)}
  .answer-block[data-kind="plan"] .answer-kind{color:var(--green)}
  .answer-block[data-kind="material"]{border-left:2px solid var(--line);padding-left:12px}
  .answer-block[data-support="unverified"]{border-color:var(--accent)}
  .block-content{white-space:pre-wrap;overflow-wrap:anywhere;font-style:normal}
  .block-content.formatted{white-space:normal}
  .block-content p{margin:0 0 8px;white-space:normal}
  .block-content p:last-child{margin-bottom:0}
  .block-content pre{max-width:100%;overflow:auto;white-space:pre;padding:10px;background:#101011;font-size:14px;line-height:1.6}
  .block-content code{font-family:Consolas,monospace;font-size:.9em}
  .block-content a{color:var(--blue)}
  .block-content ul,.block-content ol{margin:6px 0;padding-left:24px;white-space:normal}
  .quote-match{font-size:11px;color:var(--dim)}
  .material-source{padding:2px 0;border:0;background:none;color:var(--blue);font-size:12px;margin-top:4px}
  .citation-ref{display:inline;padding:0 3px;min-width:24px;border:0;background:none;color:var(--blue);font-size:12px;line-height:1.7;vertical-align:super;border-radius:2px}
  .citation-unresolved{text-decoration:underline dotted var(--accent);font-size:13px}
  .answer-review{font-size:12px;margin:8px 0}
  .answer-sources{border-top:1px solid var(--line);margin-top:14px;padding-top:8px;font-size:13px;line-height:1.6;white-space:normal}
  .answer-sources summary{cursor:pointer;overflow-wrap:anywhere;color:var(--dim)}
  .source-item{padding:8px 0;border-bottom:1px solid var(--line)}
  .source-heading,.source-partial{font-size:12px;color:var(--dim);margin:5px 0}
  .source-excerpt{max-height:260px;overflow:auto;font:13px/1.7 Consolas,"Microsoft YaHei UI",monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0;color:var(--fg)}
  button:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:3px}

  .sysmsg{color:var(--dim);font-size:13px;margin:6px 0}
  .sysmsg.err{color:var(--red)}

  footer{
    flex:0 0 auto;display:flex;gap:10px;padding:10px 16px;
    background:var(--panel);border-top:1px solid var(--line);
  }
  #manualInput{
    flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--fg);
    border-radius:8px;padding:10px 14px;font-size:15px;outline:none;
  }
  #manualInput:focus{border-color:var(--accent)}
  .hint{font-size:11px;color:#667;align-self:center;text-align:right;line-height:1.5}

  /* 对话气泡：面试官(扬声器)左蓝 / 候选人(麦克风)右绿 */
  .bubrow{display:flex;margin:4px 0}
  .bubrow.ir{justify-content:flex-start}
  .bubrow.me{justify-content:flex-end}
  .bub{
    max-width:78%;padding:8px 13px;border-radius:12px;font-size:18px;line-height:1.5;
    position:relative;white-space:pre-wrap;
  }
  .bub .who{display:block;font-size:10px;opacity:.6;margin-bottom:2px;font-weight:600}
  .bub.ir{
    background:#16233a;border:1px solid #2b4a75;border-bottom-left-radius:3px;
    color:#cfe0ff;
  }
  .bub.ir .who{color:#5b9aff}
  .bub.me{
    background:#14341f;border:1px solid #2e7a45;border-bottom-right-radius:3px;
    color:#d4f5df;
  }
  .bub.me .who{color:#4ade80}
  .bub .live{font-size:11px;color:#888;margin-left:6px}
  .bub.me .okchip{display:block;margin-top:5px;font-size:10px;color:rgba(126,226,168,.55);
    text-align:right;font-weight:400;letter-spacing:0}

  /* 知识库管理面板 */
  #kbOverlay{
    position:fixed;inset:0;background:rgba(5,8,14,.7);z-index:50;
    display:none;align-items:flex-start;justify-content:center;padding-top:60px;
  }
  #kbOverlay.show{display:flex}
  #kbPanel{
    width:min(680px,94vw);max-height:76vh;overflow-y:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:18px 20px;
  }
  #kbPanel h3{margin:2px 0 12px;font-size:17px}
  .kbgrp{margin-bottom:16px}
  .kbgrp h4{font-size:13px;color:var(--dim);margin:0 0 6px;display:flex;align-items:center;gap:8px}
  .kbgrp h4 .cnt{color:var(--accent)}
  .kbrow{
    display:flex;align-items:center;gap:8px;background:var(--panel2);
    border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:4px 0;
    font-size:13px;
  }
  .kbrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kbrow .meta{color:var(--dim);font-size:11px;white-space:nowrap}
  .kbrow.ok{border-left:3px solid var(--green)}
  .kbrow.warn{border-left:3px solid var(--accent)}
  .kbrow button{background:none;border:none;color:var(--red);cursor:pointer;font-size:13px;padding:2px 6px}
  .kbrow button:hover{background:#3a1d1d;border-radius:4px}
  .kbupload{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;align-items:center}
  .kbupload .btn{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
    border-radius:8px;padding:5px 12px;font-size:12px;cursor:pointer}
  .kbupload .btn:hover{border-color:var(--accent)}
  #kbClose{float:right;background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer}
</style>

<body class="workspace-page">
<header class="app-header">

    <a href="/" aria-current="page"><i data-lucide="messages-square"></i>面试工作区</a>
    <a id="btnKB" href="/files"><i data-lucide="library"></i>资料库</a>
    <a href="/history"><i data-lucide="history"></i>历史复盘</a>
    <a href="/settings"><i data-lucide="settings-2"></i>模型设置</a>
  </nav>
  <span id="previewBadge" class="preview-mark" hidden>离线演示</span>
</header>

<section class="capture-panel" aria-label="声音采集">
  <div class="capture-heading"><h2>声音采集</h2><span class="capture-status" role="status"><span id="stateDot"></span><span id="captureStatus">未开启</span></span><button id="btnRefreshDevices" class="command subtle"><i data-lucide="refresh-cw"></i>刷新设备</button></div>
  <div class="capture-controls">
    <label class="device-control"><span id="systemAudioLabel"><i data-lucide="headphones"></i>面试官 · 播放设备</span><select id="deviceSel" aria-label="面试官播放设备" title="会议软件播放声音的耳机、扬声器或声卡"><option value="">系统默认输出</option></select><small id="outputDeviceState">尚未采集</small></label>
    <label class="device-control"><span><i data-lucide="mic"></i><span id="micRoleLabel">我 · 麦克风输入</span></span><select id="micSel" aria-label="本人麦克风" title="本人麦克风"><option value="default">系统默认输入</option><option value="">关闭本人麦克风</option></select><small id="inputDeviceState">尚未采集</small></label>
    <div class="capture-commands">
      <button id="btnStart" class="command primary"><i data-lucide="play"></i>开始监听</button>
      <button id="btnStop" class="command" disabled title="停止采集" aria-label="停止采集"><i data-lucide="pause"></i>暂停采集</button>
      <button id="btnRecal" class="command subtle" title="重新校准" aria-label="重新校准"><i data-lucide="sliders-horizontal"></i>校准</button>
    </div>
  </div>
  <div id="captureNotice" role="status" hidden></div>
  <div class="capture-options">
    <label class="speech-mode-control">语音流程 <select id="speechMode" aria-label="语音流程" title="暂停两路采集后切换，仅当前运行期间生效"><option value="legacy">兼容流程</option><option value="active">连续语音 · 试用</option></select></label>
    <label class="audio-test-control" title="暂停采集后切换"><input id="audioTestMode" type="checkbox">麦克风提问测试</label>
  </div>
  <div id="levelWrap" class="capture-levels">
    <span class="level-reading"><span>系统声音</span><span id="levelBarOuter"><span id="levelBar"></span></span><span id="dbLabel">-- dB</span></span>
    <span class="level-reading"><span id="micDot">本人麦克风</span><span id="micBarOuter"><span id="micBar"></span></span><span id="micDbLabel">-- dB</span></span>
    <span id="floorLabel" hidden></span>
  </div>
</section>

<section id="speechDrafts" class="speech-drafts" aria-label="语音草稿" hidden></section>

<div class="session-toolbar">
  <div class="session-title"><h1>实时面试</h1><span id="resumeBadge">简历检测中…</span></div>
  <div class="session-commands">
    <span id="recordingState" class="pill" role="status"></span>
    <button id="btnResume" class="command subtle"><i data-lucide="file-user"></i>管理简历</button>
    <button id="btnPhone" class="command"><i data-lucide="smartphone"></i>手机显示</button>
    <button id="btnClear" class="command"><i data-lucide="list-plus"></i>新会话</button>
    <button id="btnEnd" class="command"><i data-lucide="square"></i>结束面试</button>
  </div>
</div>

<div class="workspace">
<aside class="question-nav" aria-label="当前会话题目">
  <div class="nav-heading"><span>当前会话</span><span id="questionCount">0 题</span></div>
  <nav id="questionList"></nav>
</aside>
<main class="reader">
<div id="feed">
  <div id="readerEmpty" class="reader-empty"><i data-lucide="messages-square"></i><span>等待新问题</span></div>

</div>

</div>

<footer class="manual-composer">
  <label for="manualInput">手动提问</label>
  <div class="manual-field"><input id="manualInput" placeholder="输入面试问题…" aria-label="输入问题"><button id="btnAsk" title="发送问题" aria-label="发送问题"><i data-lucide="arrow-up"></i></button></div>

</footer>

<dialog id="phoneDialog" aria-labelledby="phoneTitle">
  <button id="phoneClose" class="dialog-close" title="关闭" aria-label="关闭手机配对"><i data-lucide="x"></i></button>

    <button id="phoneNewCode"><i data-lucide="refresh-cw"></i>生成配对码</button>
    <button id="phoneRevoke"><i data-lucide="unlink"></i>撤销全部访问</button>
  </div>
  <p id="phoneHint"></p>
</dialog>

<!-- 知识库管理面板 -->
<div id="kbOverlay">
  <div id="kbPanel">
    <button id="kbClose" title="关闭">✕</button>
    <h3>🧠 知识库 · AI 的背景环境</h3>
    <div class="kbgrp" id="kbResumeGrp"></div>
    <div class="kbgrp" id="kbPaperGrp"></div>
    <div class="kbgrp" id="kbMatGrp"></div>
  </div>
</div>

<script src="/static/js/speech-drafts.js"></script>
<script src="/static/js/session-recording.js" type="module"></script>
<script>
const answerContentReady=window.AnswerContent?Promise.resolve(window.AnswerContent)
  :import('/static/js/answer-content.js').then(module=>window.AnswerContent=module).catch(()=>null);
const $=id=>document.getElementById(id);
let es=null,lastQuestion="",curQA=null;
let currentSession=null,latestGeneration=0;
let streamEpoch=null,lastSequence=-1,restoring=false;
let followReading=true;
const qaByTurn=new Map(),taskTargets=new Map();

function resetSession(sessionId,announce=true){
  window.SpeechDrafts?.reset();
  currentSession=sessionId;latestGeneration=0;lastQuestion='';curQA=null;
  qaByTurn.clear();taskTargets.clear();
  $('questionList').replaceChildren();$('questionCount').textContent='0 题';
  if(announce){followReading=true;$('followLatest').hidden=true;}
  window._pendingBub=null;window._voiceQ=false;
  const selfBar=$('selfBar');
  $('feed').replaceChildren();
  if(selfBar){selfBar.style.display='none';selfBar.textContent='';$('feed').appendChild(selfBar);}
  const empty=document.createElement('div');empty.id='readerEmpty';empty.className='reader-empty';
  empty.innerHTML='<i data-lucide="messages-square"></i><span>等待新问题</span>';
  $('feed').appendChild(empty);window.lucide?.createIcons();
  if(announce)addSys('已清空，开始新一轮');
}

function scrollToContent(element){
  if(!restoring&&followReading){$('feed').scrollTop=$('feed').scrollHeight;}
}
$('feed').addEventListener('scroll',()=>{
  if(restoring)return;
  const feed=$('feed');followReading=feed.scrollHeight-feed.clientHeight-feed.scrollTop<80;
  $('followLatest').hidden=followReading;
});
$('followLatest').onclick=()=>{
  followReading=true;$('followLatest').hidden=true;$('feed').scrollTop=$('feed').scrollHeight;
};

function fmtLevel(db,floor,enter){
  const lo=(floor??-70),hi=(enter??lo)+25;
  let pct=Math.round((Math.max(db,-90)-lo)/(hi-lo)*100);
  pct=Math.max(0,Math.min(100,pct));
  $('levelBar').style.width=pct+'%';
  $('dbLabel').textContent='🔊 '+db.toFixed(0);
  $('floorLabel').textContent=`${floor?.toFixed(0)||'--'} / ${enter?.toFixed(0)||'--'}`;
}
/* 麦克风 dB 条：定标 -95..-25 更直观（mic 说话通常在 -50~-25） */
function fmtMicLevel(db,speaking,active){
  let pct=Math.round((Math.max(db,-95)-(-95))/70*100);
  pct=Math.max(0,Math.min(100,pct));
  $('micBar').style.width=pct+'%';
  $('micDbLabel').textContent=db.toFixed(0)+' dB';
  $('micDot').className='pill'+(active?' on':'')+(speaking?' spk':'');
}

let captureBusy=false,captureActive=false,audioTestMode=false,macAudio=false;
function updateDevices(select,devices,defaults){
  const signature=JSON.stringify(devices||[]);
  if(select.dataset.devices===signature)return;
  const selected=select.value;
  select.replaceChildren(...defaults.map(([value,label])=>new Option(label,value)),
    ...(devices||[]).map(d=>new Option(d.name+(d.hostapi?' · '+d.hostapi:''),String(d.index))));
  if(selected&&!Array.from(select.options).some(o=>o.value===selected)){
    select.add(new Option('所选设备已断开',selected));
  }
  select.value=selected;select.dataset.devices=signature;
}
function outputDefaults(devices){
  const current=(devices||[]).find(device=>device.is_default);
  const label=macAudio?'系统声音输入':'系统默认输出';
  return [['',current?label+' · '+current.name:label]];
}
function inputDefaults(devices){
  const current=(devices||[]).find(device=>device.is_default);
  return [['default',current?'系统默认输入 · '+current.name:'系统默认输入'],['','关闭本人麦克风']];
}
function restoreCaptureSelection(select,engine,defaultValue){
  const value=String(engine?.selection??defaultValue);
  if(!Array.from(select.options).some(option=>option.value===value))select.add(new Option(engine?.device||'所选设备已断开',value));
  select.value=value;
}
async function refreshState(){
  try{
    const r=await fetch('/api/state');if(!r.ok)throw new Error('状态获取失败');const s=await r.json();
    macAudio=s.audio?.platform==='macOS';
    $('systemAudioLabel').innerHTML=macAudio
      ?'<i data-lucide="audio-lines"></i>面试官 · 系统声音输入'
      :'<i data-lucide="headphones"></i>面试官 · 播放设备';
    $('deviceSel').setAttribute('aria-label',macAudio?'系统声音输入设备':'面试官播放设备');
    $('deviceSel').title=macAudio?'用于接收系统声音的 BlackHole 或其他虚拟输入设备':'会议软件播放声音的耳机、扬声器或声卡';
    if(!captureBusy&&s.audio?.message){
      $('captureNotice').textContent=s.audio.message;$('captureNotice').hidden=false;
      $('captureNotice').classList.add('error');$('captureNotice').dataset.audioDiagnostic='true';
    }else if(!captureBusy&&$('captureNotice').dataset.audioDiagnostic==='true'){
      $('captureNotice').hidden=true;$('captureNotice').classList.remove('error');
      delete $('captureNotice').dataset.audioDiagnostic;
    }
    captureActive=!!(s.listening||s.self_listening);
    audioTestMode=!!s.audio_test_mode;
    if(!captureBusy)$('audioTestMode').checked=audioTestMode;
    $('audioTestMode').disabled=captureBusy||captureActive||speechModeBusy;
    if(!speechModeBusy)$('speechMode').value=s.speech?.mode||'legacy';
    $('speechMode').disabled=captureBusy||captureActive||speechModeBusy;
    $('captureStatus').textContent=audioTestMode?(s.self_listening?'麦克风提问测试中':'麦克风提问测试 · 未开启'):s.listening&&s.self_listening?'双通道采集中':s.listening?'系统声音采集中':s.self_listening?'本人麦克风采集中':'未开启';
    $('btnStart').disabled=captureBusy||(audioTestMode?!!s.self_listening:!!s.listening);$('btnStop').disabled=captureBusy||!captureActive;
    $('btnRefreshDevices').disabled=captureBusy||captureActive;
    $('btnRefreshDevices').title=captureActive?'暂停采集后刷新设备':'重新扫描耳机、扬声器和麦克风';
    $('previewBadge').hidden=!s.preview;
    const sel=$('deviceSel');
    sel.disabled=captureBusy||audioTestMode;
    updateDevices(sel,s.devices,outputDefaults(s.devices));
    const msel=$('micSel');
    updateDevices(msel,s.input_devices,inputDefaults(s.input_devices));
    msel.querySelector('option[value=""]').disabled=audioTestMode;
    if(audioTestMode&&msel.value==='')msel.value='default';
    $('micRoleLabel').textContent=audioTestMode?'提问 · 麦克风输入':'我 · 麦克风输入';
    if(!captureBusy){
      if(s.listening)restoreCaptureSelection(sel,s.engine,'');
      if(s.self_listening)restoreCaptureSelection(msel,s.self_engine,'default');
    }
    $('outputDeviceState').textContent=audioTestMode?'测试模式 · 已停用':s.listening?'采集中 · '+(s.engine?.device||'当前播放设备'):'尚未采集';
    $('inputDeviceState').textContent=s.self_listening?'采集中 · '+(s.self_engine?.device||'当前麦克风'):'尚未采集';
    // 麦克风电平条 + 状态
    if(s.self_engine){
      fmtMicLevel(s.self_engine.last_level_db ?? -100,
                  s.self_engine.speaking, s.self_listening);
    }else{
      fmtMicLevel(-100,false,false);
    }
    // 我的发言浮条
    if(s.self_listening&&!audioTestMode){
      $('selfBar').style.display='block';
      $('selfBar').textContent='🎤 我(最近): '+(s.self_recent||'（开始说话后这里显示你的转写）');
    }else{
      $('selfBar').style.display='none';
    }
    if(s.resume){
      const b=$('resumeBadge');
      if(s.resume.loaded){
        b.textContent='简历 · '+(s.resume.source||'已加载');
        b.style.color='var(--green)';
        b.title='来源: '+(s.resume.origin||s.resume.source)+'\n加载于 '+(s.resume.loaded_at||'')+'\nAI 作答将引用这份简历的真实项目与数据';
      }else{
        b.textContent='简历未加载';b.style.color='var(--accent)';b.title='管理简历';
      }
    }
    window.lucide?.createIcons();
    if(s.listening){
      const e=s.engine||{};
      fmtLevel(e.last_level_db??-100,e.noise_floor_db,e.speech_enter_db);
      $('stateDot').className=e.speaking?'on speaking':'on';
    }else{
      $('stateDot').className='';
      if(audioTestMode&&s.self_listening)$('stateDot').className=s.self_engine?.speaking?'on speaking':'on';
    }
  }catch(e){}
}

function addSys(msg,isErr){
  const d=document.createElement('div');
  d.className='sysmsg'+(isErr?' err':'');d.textContent=msg;
  $('feed').appendChild(d);scrollToContent(d);
}

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');

function renderQuick(box,raw,done,qaEl=box.parentElement,answerDoc=null,sources=[],allowFull=true){
  const api=window.AnswerContent;
  if(!api){box.textContent=raw;return;}
  const value=api.isAnswerDocument(answerDoc,'quick')?answerDoc:api.draftDocument(raw,'quick',sources);
  api.renderDocument(box,value);
  box.classList.remove('pending');
  if(done)renderDirs(qaEl,value.directions.map(item=>({name:item.name,desc:item.description})),allowFull);
}

function renderDirs(qaEl,dirs,allowFull=true){
  const old=qaEl.querySelector('.dirrow');if(old)old.remove();
  dirs=dirs.filter(item=>item.name);
  if(!dirs.length&&!allowFull)return;
  const row=document.createElement('div');row.className='dirrow';
  row.innerHTML='<span class="lbl">↳ 深挖：</span>';
  dirs.forEach(d=>{
    const c=document.createElement('button');c.className='chip';
    c.dataset.direction=d.name;
    c.innerHTML=`${esc(d.name)}<small>${esc(d.desc)}</small>`;
    c.onclick=()=>askDetail(d.name,qaEl,c);
    row.appendChild(c);
  });
  if(allowFull){
    const full=document.createElement('button');full.className='chip full';
    full.dataset.direction='完整版';full.textContent='完整版';
    full.onclick=()=>askDetail('完整版',qaEl,full);
    row.appendChild(full);
  }
  qaEl.appendChild(row);
}

/* ---------- 两级事件流 ---------- */
function addBubble(text, who, side, ts){
  $('readerEmpty')?.remove();
  /* who: '面试官'/'我'; side: ir左/me右
     我的语音 = 纯历史记录：只加『✓已记入上下文』角标，永不附带 AI 回复 */
  const row=document.createElement('div');
  row.className='bubrow '+side;
  const chip=(who==='我')
    ?`<span class="okchip" title="只存本机历史，并作为后续出卡的上下文；不会对你生成 AI 建议">✓ 已记录 · 作上下文</span>`
    :'';
  row.innerHTML=`<div class="bub ${side}"><span class="who">${who} ${ts||''}</span>${esc(text)}${chip}</div>`;
  $('feed').appendChild(row);scrollToContent(row);
  return row.querySelector('.bub');
}

function beginQA(q,ts,event){
  $('readerEmpty')?.remove();
  curQA={};
  const qa=document.createElement('div');qa.className='qa';
  qa.dataset.turnId=event.turn_id;
  qa.innerHTML=`<div class="qbox"><span class="t">${ts}</span>${md(q)}</div>
    <div class="quickcard pending">思考中…</div>`;
  $('feed').appendChild(qa);scrollToContent(qa);
  Object.assign(curQA,{el:qa,card:qa.querySelector('.quickcard'),subs:new Map(),
    sessionId:event.session_id,turnId:event.turn_id,generation:event.generation,status:'pending'});
  qaByTurn.set(event.turn_id,curQA);
  const link=document.createElement('button');link.className='question-link';
  link.dataset.turnId=event.turn_id;
  const index=document.createElement('span');index.className='nav-index';index.textContent='问题 '+qaByTurn.size;
  const label=document.createElement('span');label.className='nav-label';label.textContent=q;
  link.append(index,label);link.setAttribute('aria-current',String(followReading||qaByTurn.size===1));
  if(followReading)for(const item of $('questionList').children)item.setAttribute('aria-current','false');
  link.onclick=()=>{
    followReading=false;$('followLatest').hidden=false;
    qa.scrollIntoView({block:'start'});
    for(const item of $('questionList').children)item.setAttribute('aria-current',String(item===link));
  };
  $('questionList').append(link);$('questionCount').textContent=qaByTurn.size+' 题';
  return curQA;
}

function beginSub(qa,direction,ts,taskId){
  const old=qa.subs.get(direction);
  const element=old?.el||document.createElement('div');element.className='subcard pending';
  element.innerHTML=`<div class="hd">🔎 深挖 · ${esc(direction)} ${esc(ts||'')}</div>生成中…`;
  if(!element.isConnected)qa.el.appendChild(element);
  const sub={el:element,status:'pending'};
  qa.subs.set(direction,sub);
  const target={qa,box:element,raw:'',level:'detail',direction,sub,taskId,attempt:0,model:''};
  taskTargets.set(taskId,target);
  renderAnswer(target,'','pending');
  scrollToContent(element);
  return sub;
}

function updateDirectionButtons(qa){
  const busy=[...qa.subs.values()].some(sub=>['pending','streaming'].includes(sub.status));
  qa.el.querySelectorAll('.chip').forEach(button=>{
    button.disabled=busy||qa.subs.get(button.dataset.direction)?.status==='complete';
  });
}

function renderAnswer(target,content,status,error='',answerDoc=null){
  target.raw=content;
  target.status=status;target.error=error;target.document=answerDoc;
  if(answerDoc?.sources)target.sources=answerDoc.sources;
  if(!window.AnswerContent&&!target.waitingForRenderer){
    target.waitingForRenderer=true;
    answerContentReady.then(api=>{
      if(api&&target.box.isConnected)renderAnswer(target,target.raw,target.status,target.error,target.document);
    });
  }
  if(!target.body){
    target.body=document.createElement('div');target.body.className='answer-body';
    const actions=document.createElement('div');actions.className='answer-actions';
    target.stateLabel=document.createElement('span');target.stateLabel.className='answer-state';
    target.cancelButton=document.createElement('button');target.cancelButton.className='cancel-generation';
    target.cancelButton.type='button';target.cancelButton.innerHTML='<i data-lucide="square"></i><span>取消生成</span>';
    target.cancelButton.title='取消生成';target.cancelButton.setAttribute('aria-label','取消生成');
    target.cancelButton.onclick=()=>cancelGeneration(target);
    actions.append(target.stateLabel,target.cancelButton);
    target.box.replaceChildren(target.body,actions);
    window.lucide?.createIcons();
  }
  const body=target.body;
  target.box.classList.toggle('pending',status==='pending');
  if(status==='error'&&!content){
    body.textContent='';
  }else if(status==='pending'&&!content){
    body.textContent=target.level==='detail'?'生成中…':'思考中…';
  }else if(target.level==='detail'){
    const api=window.AnswerContent;
    if(api){
      const value=api.isAnswerDocument(answerDoc,'detail')?answerDoc:api.draftDocument(content,'detail',target.sources||[]);
      api.renderDocument(body,value);
      const heading=window.document.createElement('div');heading.className='hd';
      heading.textContent='深挖 · '+target.direction;body.prepend(heading);
    }else body.textContent=content;
  }else{
    renderQuick(body,content||(status==='cancelled'?'':'未返回内容'),status==='complete',target.qa.el,
      answerDoc,target.sources||[],target.model!=='local:clarification');
  }
  target.stateLabel.classList.toggle('error',status==='error');
  target.stateLabel.textContent=status==='error'?'生成失败：'+(error||'请重试')
    :status==='cancelled'?'已取消':(target.attempt>1?'备用模型 · ':'')+(target.model||'');
  target.cancelButton.hidden=!['pending','streaming'].includes(status);
  target.cancelButton.disabled=!!target.cancelPending;
  if(target.sub)target.sub.status=status;else target.qa.status=status;
  updateDirectionButtons(target.qa);
  scrollToContent(target.box);
}

async function cancelGeneration(target){
  if(target.cancelPending||taskTargets.get(target.taskId)!==target)return;
  target.cancelPending=true;target.cancelButton.disabled=true;
  try{
    const response=await fetch('/api/cancel',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({session_id:target.qa.sessionId,task_id:target.taskId})});
    const result=await response.json();
    if(!result.ok)throw new Error(result.error||'请求失败');
  }catch(error){
    if(taskTargets.get(target.taskId)===target)addSys('取消失败：'+error.message,true);
  }finally{
    target.cancelPending=false;target.cancelButton.disabled=false;
  }
}

function eventPosition(id){
  const match=/^([a-f0-9]{32}):(\d+)$/.exec(id||'');
  if(!match)return null;
  const sequence=Number(match[2]);
  return Number.isSafeInteger(sequence)?{epoch:match[1],sequence}:null;
}

function restoreSnapshot(event){
  const position=eventPosition(event.event_id);
  if(!position||!Array.isArray(event.turns))return;
  if(position.epoch===streamEpoch&&position.sequence<lastSequence)return;
  const feed=$('feed'),top=feed.scrollTop;
  const selectedTurn=$('questionList').querySelector('[aria-current="true"]')?.dataset.turnId;
  const followLatest=currentSession!==event.session_id||(followReading&&feed.scrollHeight-feed.clientHeight-top<80);
  restoring=true;
  try{
    resetSession(event.session_id,false);
    for(const turn of event.turns){
      const qa=beginQA(turn.question,turn.at||'',{...turn,session_id:event.session_id});
      qa.status=turn.status;
      latestGeneration=Math.max(latestGeneration,turn.generation);
      lastQuestion=turn.question;
      for(const answer of turn.answers||[]){
        let target;
        if(answer.level==='quick'){
          target={qa,box:qa.card,raw:'',level:'quick',taskId:answer.task_id};
          taskTargets.set(answer.task_id,target);
        }else if(answer.level==='detail'){
          beginSub(qa,answer.direction,'',answer.task_id);
          target=taskTargets.get(answer.task_id);
        }else continue;
        target.attempt=answer.attempt||0;target.model=answer.model||'';
        renderAnswer(target,answer.content,answer.status,answer.error,answer.document);
        if(!['pending','streaming'].includes(answer.status))taskTargets.delete(answer.task_id);
      }
      updateDirectionButtons(qa);
    }
    for(const draft of event.speech_drafts||[])window.SpeechDrafts?.update(draft,event.session_id);
    streamEpoch=position.epoch;lastSequence=position.sequence;
    if(!followLatest&&selectedTurn){
      for(const item of $('questionList').children)item.setAttribute('aria-current',String(item.dataset.turnId===selectedTurn));
    }
    $('connectionState').textContent='已连接';
  }finally{
    restoring=false;
    followReading=followLatest;
    feed.scrollTop=followLatest?feed.scrollHeight:top;
    $('followLatest').hidden=followLatest;
  }
}

function connectSSE(){
  if(es)es.close();
  const source=new EventSource('/api/events');es=source;
  source.onmessage=m=>{
    if(es!==source)return;
    let ev;try{ev=JSON.parse(m.data)}catch(e){return}
    const t=ev.type;
    if(t==='session_snapshot'){restoreSnapshot(ev);return;}
    const position=eventPosition(ev.event_id||m.lastEventId);
    if(t==='stream_ready'){
      if(position&&position.epoch===streamEpoch&&position.sequence===lastSequence){
        $('connectionState').textContent='已连接';
      }else connectSSE();
      return;
    }
    if(position){
      if(position.epoch===streamEpoch&&position.sequence<=lastSequence)return;
      if(position.epoch!==streamEpoch||position.sequence!==lastSequence+1){connectSSE();return;}
      lastSequence=position.sequence;
    }
    if(t==='session_reset'){resetSession(ev.session_id);return;}
    if(ev.session_id){
      if(currentSession===null)currentSession=ev.session_id;
      if(ev.session_id!==currentSession)return;
    }
    if(t==='speech_draft'){
      window.SpeechDrafts?.update(ev,currentSession);
    }else if(t==='question'){
      const spk=ev.speaker||'interviewer';
      if(spk==='self'){
        // 麦克风通道：我的发言 → 右绿气泡，仅记录不触发答题
        window._lastSelfBub=addBubble(ev.text,'我','me',ev.at||'');
      }else if(ev.manual){
        // 手动输入问题 → 直接建卡（保留原有快速提问路径）
        window._voiceQ=false;
        lastQuestion=ev.text;
      }else{
        // 扬声器通道：面试官发言 → 左蓝气泡；合并成题时由 answer_start 出卡
        window._voiceQ=true;
        lastQuestion=ev.text;
        const bub=addBubble(ev.text,'面试官','ir',ev.at||'');
        // 若上一道题还没出卡(防抖等待中)，记下气泡引用供合并后更新
        window._pendingBub=bub;
      }
    }else if(t==='answer_start'){
      if(!ev.turn_id||!ev.task_id||ev.generation<latestGeneration||taskTargets.has(ev.task_id))return;
      latestGeneration=ev.generation;
      for(const [id,target] of taskTargets){
        if(target.level==='quick'){
          renderAnswer(target,target.raw,'cancelled');taskTargets.delete(id);
        }
      }
      lastQuestion=ev.question||'';
      const anchor=window._pendingBub;window._pendingBub=null;
      const qa=qaByTurn.get(ev.turn_id)||beginQA(lastQuestion,ev.at||'',ev);
      if(qa.generation!==ev.generation){
        for(const [id,target] of taskTargets)if(target.qa===qa)taskTargets.delete(id);
        for(const sub of qa.subs.values())sub.el.remove();qa.subs.clear();
        qa.generation=ev.generation;qa.status='pending';
        qa.el.querySelector('.qbox').innerHTML=`<span class="t">${esc(ev.at||'')}</span>${md(lastQuestion)}`;
        for(const link of $('questionList').children)if(link.dataset.turnId===ev.turn_id)link.querySelector('.nav-label').textContent=lastQuestion;
        qa.el.querySelector('.dirrow')?.remove();
      }
      const target={qa,box:qa.card,raw:'',level:'quick',taskId:ev.task_id,attempt:0,model:''};
      taskTargets.set(ev.task_id,target);renderAnswer(target,'','pending');
      if(anchor?.isConnected){
        anchor.textContent=ev.question;
        anchor.closest('.bubrow').insertAdjacentElement('afterend',qa.el);
      }
    }else if(t==='detail_start'){
      const qa=qaByTurn.get(ev.turn_id);
      if(!qa||qa.generation!==ev.generation||!ev.task_id||taskTargets.has(ev.task_id))return;
      beginSub(qa,ev.direction,ev.at,ev.task_id);updateDirectionButtons(qa);
    }else if(['answer_context','answer_attempt','answer_delta','answer_done','answer_error','answer_cancelled'].includes(t)){
      const target=taskTargets.get(ev.task_id);
      if(!target||target.qa.turnId!==ev.turn_id||target.qa.generation!==ev.generation||target.level!==ev.level)return;
      if(t==='answer_context'){
        target.sources=Array.isArray(ev.sources)?ev.sources:[];return;
      }
      if(t==='answer_attempt'){
        if(!Number.isInteger(ev.attempt)||ev.attempt<=(target.attempt||0))return;
        target.attempt=ev.attempt;target.model=ev.model||'';
        renderAnswer(target,'','pending');return;
      }
      if(t!=='answer_cancelled'&&(ev.attempt||0)!==(target.attempt||0))return;
      const status=t==='answer_cancelled'?'cancelled':t==='answer_error'?'error':t==='answer_done'?'complete':'streaming';
      const content=t==='answer_done'?ev.full:target.raw+(ev.delta||'');
      renderAnswer(target,content,status,ev.message,ev.document);
      if(t!=='answer_delta'){
        taskTargets.delete(ev.task_id);updateDirectionButtons(target.qa);
      }
    }else if(t==='status'){
      addSys((ev.level==='error'?'⚠ ':'')+ev.message,ev.level==='error');
    }else if(t==='calibrated'){
      addSys(`✅ 校准完成：噪声底 ${ev.noise_floor}dB，触发阈值 ${ev.enter}dB`);
    }
  };
  source.onopen=()=>{if(es===source)$('connectionState').textContent='同步中';};
  source.onerror=()=>{if(es===source)$('connectionState').textContent='连接中断';};
}

async function askDetail(direction,qaEl,chipEl){
  const qa=qaByTurn.get(qaEl.dataset.turnId);
  if(!qa)return;
  const existing=qa.subs.get(direction);
  if(existing&&!['error','cancelled'].includes(existing.status))return;
  // 禁用本行所有芯片，防连点
  const row=chipEl.closest('.dirrow');
  row.querySelectorAll('.chip').forEach(c=>c.disabled=true);
  try{
    const r=await fetch('/api/detail',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({direction,turn_id:qa.turnId,session_id:qa.sessionId})});
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||'请求失败');
  }catch(error){
    addSys('深挖失败: '+error.message,true);updateDirectionButtons(qa);
  }
}

/* ---------- 控制区 ---------- */
async function captureRequest(action,source,selection){
  const body={source};
  if(action==='start')body.device_index=selection===''||selection==='default'?null:Number(selection);
  const r=await fetch('/api/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const value=await r.json();
  if(!r.ok||!value.ok)throw new Error(value.error||'采集操作失败');
}
async function captureAction(work){
  if(captureBusy)return;
  captureBusy=true;
  $('captureNotice').hidden=true;$('captureNotice').classList.remove('error');
  for(const id of ['btnStart','btnStop','micSel','deviceSel','btnRefreshDevices','audioTestMode','speechMode'])$(id).disabled=true;
  try{await work();}catch(error){$('captureNotice').textContent=error.message;$('captureNotice').hidden=false;$('captureNotice').classList.add('error');}
  finally{
    captureBusy=false;$('micSel').disabled=false;$('deviceSel').disabled=false;
    await refreshState();
  }
}
$('btnStart').onclick=async()=>{
  await captureAction(async()=>{
    if(!audioTestMode)await captureRequest('start','loopback',$('deviceSel').value);
    if($('micSel').value!=='')await captureRequest('start','mic',$('micSel').value);
  });
};
$('btnStop').onclick=async()=>{
  await captureAction(async()=>{
    const results=await Promise.allSettled([captureRequest('stop','loopback'),captureRequest('stop','mic')]);
    const error=results.find(r=>r.status==='rejected');if(error)throw error.reason;
  });
};
$('micSel').onchange=()=>{if(captureActive)captureAction(()=>captureRequest($('micSel').value===''?'stop':'start','mic',$('micSel').value));};
$('deviceSel').onchange=()=>{if(captureActive&&!audioTestMode)captureAction(()=>captureRequest('start','loopback',$('deviceSel').value));};
$('audioTestMode').onchange=()=>captureAction(async()=>{
  const response=await fetch('/api/audio/test-mode',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({enabled:$('audioTestMode').checked})});
  const result=await response.json();
  if(!response.ok||!result.ok)throw new Error(result.error||'测试模式切换失败');
  audioTestMode=result.enabled;
});
$('btnRefreshDevices').onclick=()=>captureAction(async()=>{
  const selections=[['deviceSel','devices','',outputDefaults],['micSel','input_devices','default',inputDefaults]].map(([id,key,fallback,defaults])=>{
    const select=$(id),previous=JSON.parse(select.dataset.devices||'[]').find(device=>String(device.index)===select.value);
    return {select,key,fallback,defaults,previous,value:select.value};
  });
  const response=await fetch('/api/audio/devices/refresh',{method:'POST'}),value=await response.json();
  if(!response.ok||!value.ok)throw new Error(value.error||'设备刷新失败');
  for(const item of selections){
    const devices=value[item.key]||[];
    updateDevices(item.select,devices,item.defaults(devices));
    const matches=item.previous?devices.filter(device=>device.name===item.previous.name&&device.hostapi===item.previous.hostapi):[];
    item.select.value=item.previous?(matches.length===1?String(matches[0].index):item.fallback):item.value;
  }
  $('captureNotice').textContent='设备列表已刷新';$('captureNotice').hidden=false;
});
$('btnRecal').onclick=()=>fetch('/api/recalibrate',{method:'POST'});
$('btnResume').onclick=()=>{location.href='/files?kind=resume';};
$('btnClear').onclick=async()=>{
  if(!confirm('清空屏幕和 AI 对话记忆？'))return;
  try{
    const r=await fetch('/api/clear',{method:'POST'});const j=await r.json();
    if(!j.ok)throw new Error(j.error||'请求失败');
    if(currentSession!==j.session_id)connectSSE();
  }catch(error){addSys('清空失败: '+error.message,true);}
};

/* ---------- 知识库管理面板 ---------- */
let kbUpTimer=null;
function kbRowHTML(nm,meta,cls){
  return `<div class="kbrow ${cls}"><span class="nm">${esc(nm)}</span><span class="meta">${esc(meta)}</span></div>`;
}
async function refreshKB(){
  const r=await fetch('/api/state');const s=await r.json();
  // 简历
  let html='<h4>📄 简历 <span class="cnt">'+(s.resume.loaded?'· '+s.resume.source+' ('+s.resume.chars+'字)':'· 未加载')+'</span></h4>';
  if(s.resume.loaded){
    html+=kbRowHTML(s.resume.source,'来源: '+(s.resume.note||'auto')+' | 加载于 '+s.resume.loaded_at,'ok');
  }else{
    html+='<div class="sysmsg err">未找到简历——把 PDF 放桌面重启，或点下方按钮上传</div>';
  }
  html+=`<div class="kbupload"><button class="btn" onclick="kbUploadResume()">⬆ 上传/更换简历(PDF/MD/TXT)</button></div>`;
  $('kbResumeGrp').innerHTML=html;
  // 论文
  const pp=s.papers||{count:0,items:[]};
  html='<h4>📚 论文 <span class="cnt">'+pp.count+' 篇</span></h4>';
  if(pp.items.length){
    for(const it of pp.items){
      html+=`<div class="kbrow ${it.has_digest?'ok':'warn'}"><span class="nm">${esc(it.source)}</span>
        <span class="meta">${it.has_digest?'已摘要':'摘要中…'}</span></div>`;
    }
  }else{
    html+='<div class="sysmsg">无论文（桌面 paper_paths 自动发现或手动上传）</div>';
  }
  html+=`<div class="kbupload"><button class="btn" onclick="kbUploadPaper()">⬆ 上传论文(PDF)</button></div>`;
  $('kbPaperGrp').innerHTML=html;
  // 材料
  const mm=s.materials||{count:0,items:[]};
  html='<h4>🧩 辅助材料 <span class="cnt">'+mm.count+' 份</span></h4>';
  if(mm.items.length){
    for(const it of mm.items){
      html+=`<div class="kbrow ${it.has_digest?'ok':'warn'}"><span class="nm">${esc(it.source)}</span>
        <span class="meta">${it.chars}字 · ${it.has_digest?'已摘要':'摘要中…'}</span>
        <button title="删除" onclick="kbRemoveMat('${it.key}')">🗑</button></div>`;
    }
  }else{
    html+='<div class="sysmsg">无辅助材料——项目文档/方案/代码/参考资料传这里，AI 可引用</div>';
  }
  html+=`<div class="kbupload"><button class="btn" onclick="kbUploadMat()">⬆ 上传材料(文档/代码/多选)</button></div>`;
  $('kbMatGrp').innerHTML=html;
}
function pickFiles(accept,multi,cb){
  const inp=document.createElement('input');
  inp.type='file';inp.accept=accept;if(multi)inp.multiple=true;
  inp.onchange=async()=>{ if(!inp.files||!inp.files.length)return;
    for(const f of inp.files){ cb(f); }
  };
  inp.click();
}
function uploadOne(url,f,label){
  const fd=new FormData();fd.append('file',f);
  addSys(label+' '+f.name+' …');
  fetch(url,{method:'POST',body:fd}).then(r=>r.json()).then(j=>{
    if(j.ok)addSys('✅ '+label+'成功: '+f.name);
    else addSys('⚠ '+label+'失败: '+(j.error||'?')+' — '+f.name,true);
    refreshKB();
  }).catch(e=>{addSys('⚠ 网络错误: '+e,true);});
}
function kbUploadResume(){ pickFiles('.pdf,.md,.txt',false,f=>uploadOne('/api/resume/upload',f,'简历上传')); }
function kbUploadPaper(){ pickFiles('.pdf',false,f=>uploadOne('/api/paper/upload',f,'论文上传')); }
function kbUploadMat(){ pickFiles('.pdf,.md,.txt,.py,.js,.ts,.java,.go,.c,.cpp,.rs,.json,.yaml,.yml,.sql,.html,.css,.toml,.sh,.csv',true,
    f=>uploadOne('/api/material/upload',f,'材料上传')); }
async function kbRemoveMat(key){
  if(!confirm('删除这份材料？(不影响已保存的历史)'))return;
  const r=await fetch('/api/material/remove',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({key})});
  const j=await r.json();
  if(j.ok){addSys('✅ 材料已删除');refreshKB();}else{addSys('⚠ 删除失败: '+(j.error||'?'),true);}
}
$('btnKB').onclick=()=>{location.href='/files';};
$('kbClose').onclick=()=>$('kbOverlay').classList.remove('show');
$('kbOverlay').addEventListener('click',e=>{ if(e.target.id==='kbOverlay')$('kbOverlay').classList.remove('show'); });

async function askManual(){
  const t=$('manualInput').value.trim();if(!t)return;
  $('manualInput').value='';
  await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});
}
$('btnAsk').onclick=askManual;
$('manualInput').addEventListener('keydown',e=>{if(e.key==='Enter')askManual();});

document.addEventListener('keydown',e=>{
  if(e.key==='F8'&&lastQuestion){
    fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:lastQuestion})});
    e.preventDefault();
  }else if(e.key==='F9'){$('btnClear').click();e.preventDefault();}
});

refreshState();setInterval(refreshState,800);
connectSSE();
