[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-copilot"
version = "0.1.0"
description = "Windows-first local interview copilot"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
audio = [
    "numpy>=1.26,<3",
    "PyAudioWPatch>=0.2.12.7; platform_system == 'Windows'",
]
pdf = ["pypdf>=5,<7"]
dev = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
