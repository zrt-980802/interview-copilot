<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>工作笔记</title>
  <link rel="stylesheet" href="/static/files.css">
  <link rel="stylesheet" href="/static/app-shell.css">
  <script src="/static/vendor/lucide.js" defer></script>
  <script src="/static/js/files.js" type="module"></script>
</head>
<body class="files-page">
  <header class="app-header">
    <a class="app-brand" href="/"><i data-lucide="audio-lines"></i>面试辅助</a>
    <nav class="app-nav" aria-label="主导航">
      <a id="workspaceBack" href="/"><i data-lucide="messages-square"></i>面试工作区</a>
      <a href="/files" aria-current="page"><i data-lucide="library"></i>资料库</a>
      <a href="/history"><i data-lucide="history"></i>历史复盘</a>
      <a href="/settings"><i data-lucide="settings-2"></i>模型设置</a>
    </nav>
  </header>
  <div class="page-toolbar">
    <div class="page-title"><h1>资料库</h1><span id="totals"></span></div>
    <div class="page-actions"><button id="backToFiles" class="command back-command"><i data-lucide="arrow-left"></i>返回文件列表</button><button id="refresh" class="command subtle"><i data-lucide="refresh-cw"></i>刷新资料</button></div>
  </div>
  <div id="notice" role="status" hidden></div>
  <div class="library-workspace">
    <main id="filesPanel">
      <div class="upload-toolbar">
        <label class="upload-kind">资料类型<select id="uploadKind" aria-label="上传资料类型">
          <option value="reference">参考资料</option><option value="resume">简历</option>
          <option value="candidate">本人项目资料</option><option value="paper">论文</option><option value="jd">岗位说明</option>
        </select></label>
        <button id="upload" class="command primary"><i data-lucide="upload"></i>上传文件</button>
        <button id="openGithub" class="command"><i data-lucide="github"></i>导入 GitHub</button>
        <input id="fileInput" type="file" multiple hidden accept=".pdf,.docx,.md,.markdown,.txt,.py,.js,.ts,.java,.go,.c,.cpp,.h,.hpp,.rs,.json,.yaml,.yml,.sql,.html,.css,.xml,.toml,.sh,.csv">
      </div>
      <div id="uploadProgress" role="status" hidden></div>
      <div class="filter-toolbar">
        <div id="viewFilters" class="segments" role="group" aria-label="文件状态筛选">
          <button data-view="all" aria-pressed="true">全部</button><button data-view="processing" aria-pressed="false">处理中</button>
          <button data-view="error" aria-pressed="false">失败</button><button data-view="archived" aria-pressed="false">已归档</button>
        </div>
        <label class="search"><i data-lucide="search"></i><input id="search" type="search" aria-label="搜索文件" placeholder="搜索文件" maxlength="200"></label>
      </div>
      <div id="listState" role="status"></div>
      <div class="file-table-wrap">
        <table><thead><tr><th>文件</th><th class="kind-col">类型</th><th>状态</th><th>启用</th></tr></thead><tbody id="fileRows"></tbody></table>
      </div>
      <details id="legacyPanel" hidden><summary id="legacyHeading"></summary><div id="legacyFiles"></div></details>
    </main>
    <aside id="inspector" aria-label="文件详情">
      <div id="detailEmpty">选择文件</div>
      <div id="detailState" role="status"></div>
      <div id="fileDetail" hidden>
        <div class="detail-heading"><h2 id="detailName"></h2></div>
        <div class="document-actions"><a id="download" class="command subtle"><i data-lucide="download"></i>下载原文件</a><button id="archive" class="command subtle"><i data-lucide="archive"></i>归档文件</button></div>
        <div id="fileMeta"></div>
        <a id="sourceLink" target="_blank" rel="noopener noreferrer" hidden></a>
        <ol id="initialization" aria-label="初始化状态"></ol>
        <div id="fileError" role="status" hidden></div>
        <button id="retry" class="command" hidden><i data-lucide="rotate-cw"></i>重新初始化</button>
        <form id="fileProperties">
          <label>资料名称<input id="fileTitle" maxlength="160" required></label>
          <label>资料类型<select id="fileKind"><option value="reference">参考资料</option><option value="resume">简历</option><option value="candidate">本人项目资料</option><option value="paper">论文</option><option value="jd">岗位说明</option></select></label>
          <button id="save" class="command primary" type="submit"><i data-lucide="save"></i>保存属性</button>
        </form>
        <div class="knowledge-toolbar"><span id="knowledgeState" role="status"></span><button id="analyze" class="command subtle"><i data-lucide="scan-text"></i>分析资料</button></div>
        <div class="preview-heading"><div class="segments" role="group" aria-label="内容视图"><button id="overviewTab" aria-pressed="true">概览</button><button id="knowledgeTab" aria-pressed="false">事实与项目</button><button id="textTab" aria-pressed="false">正文</button></div><span id="textCount"></span></div>
        <div id="knowledgePanel" hidden></div>
        <pre id="preview"></pre>
      </div>
    </aside>
  </div>
  <dialog id="githubDialog" aria-labelledby="githubTitle">
    <form id="githubForm"><div class="dialog-heading"><h2 id="githubTitle">导入 GitHub Markdown</h2><button id="closeGithub" class="icon" type="button" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></div>
      <label>公开文件链接<input id="githubUrl" type="url" required maxlength="2048" placeholder="https://github.com/owner/repo/blob/main/README.md"></label>
      <div id="githubError" role="status"></div><button id="importGithub" class="command" type="submit"><i data-lucide="download"></i>导入</button>
    </form>
  </dialog>
  <dialog id="sourceDialog" aria-labelledby="sourceTitle">
    <div class="dialog-heading"><h2 id="sourceTitle">原文依据</h2><button id="closeSource" class="icon" title="关闭" aria-label="关闭原文"><i data-lucide="x"></i></button></div>
    <div id="sourceState" role="status"></div><pre id="sourceText"></pre>
  </dialog>
</body>
</html>
