<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>历史复盘 · 面试辅助</title>
  <link rel="stylesheet" href="/static/history.css">
  <link rel="stylesheet" href="/static/answer-content.css">
  <link rel="stylesheet" href="/static/app-shell.css">
  <script src="/static/vendor/lucide.js" defer></script>
  <script src="/static/js/history.js" type="module"></script>
</head>
<body class="history-page">
  <header class="app-header">
    <a class="app-brand" href="/"><i data-lucide="audio-lines"></i>面试辅助</a>
    <nav class="app-nav" aria-label="主导航">
      <a id="workspaceBack" href="/"><i data-lucide="messages-square"></i>面试工作区</a>
      <a href="/files"><i data-lucide="library"></i>资料库</a>
      <a href="/history" aria-current="page"><i data-lucide="history"></i>历史复盘</a>
      <a href="/settings"><i data-lucide="settings-2"></i>模型设置</a>
    </nav>
  </header>
  <div class="page-toolbar"><div class="page-title"><h1>历史复盘</h1></div><div class="page-actions"><button id="backToList" class="command back-command"><i data-lucide="arrow-left"></i>返回会话列表</button><button id="refresh" class="command subtle"><i data-lucide="refresh-cw"></i>刷新历史</button></div></div>
  <div class="history-workspace">
    <aside id="sessionsPanel" aria-label="历史会话">
      <form id="searchForm" role="search"><i data-lucide="search"></i><input id="search" type="search" maxlength="200" placeholder="搜索问题或回答" aria-label="搜索历史"></form>
      <div id="listState" role="status"></div>
      <nav id="sessionList" aria-label="选择会话"></nav>
      <button id="loadMore" hidden><i data-lucide="chevron-down"></i>更多会话</button>
    </aside>
    <main id="reviewPanel">
      <div id="reviewEmpty">选择会话</div>
      <div id="reviewState" role="status"></div>
      <div id="sessionToolbar" hidden>
        <div class="session-heading"><h2 id="sessionTitle"></h2><div id="sessionMeta"></div></div>
        <a id="export" class="command"><i data-lucide="download"></i>导出 Markdown</a>
      </div>
      <div id="reviewContent" tabindex="0"></div>
    </main>
  </div>
</body>
</html>
